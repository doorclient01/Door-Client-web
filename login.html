<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Door Client</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050a0c; --teal:#2dd4bf; --teal-2:#38bdf8; --mint:#c8fff3;
    --ink:#eafffb; --ink-dim:#94aca8; --line:rgba(200,255,243,0.14);
    --display:'Space Grotesk',sans-serif; --body:'Manrope',sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(45,212,191,0.14), transparent 65%),
      var(--bg);
    color:var(--ink); font-family:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  a{ color:var(--teal); text-decoration:none; }
  .card{
    width:100%; max-width:380px;
    background:rgba(10,20,22,0.75); border:1px solid var(--line);
    border-radius:16px; padding:32px;
  }
  h1{ font-family:var(--display); font-size:1.4rem; margin-bottom:6px; }
  .sub{ color:var(--ink-dim); font-size:13px; margin-bottom:24px; }
  label{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:6px; }
  input{
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line);
    border-radius:8px; color:var(--ink); padding:11px; font-size:14px; margin-bottom:16px;
  }
  input:focus{ outline:none; border-color:var(--teal); }
  button{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(120deg, var(--teal-2), var(--teal));
    color:#032420; font-weight:700; font-size:14px; cursor:pointer;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .toggle{ text-align:center; font-size:13px; color:var(--ink-dim); margin-top:18px; }
  .msg{ font-size:12px; margin-bottom:14px; min-height:16px; }
  .msg.error{ color:#f87171; }
  .msg.ok{ color:var(--mint); }
</style>
</head>
<body>
  <div class="card">
    <h1 id="formTitle">Sign in</h1>
    <p class="sub">Sign in to see your credits and generate capes in Cosmetic Lab.</p>
    <p class="msg" id="msg"></p>
    <form id="authForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6">
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <a href="#" id="toggleLink">Create one</a>
    </p>
  </div>

<script>
const BACKEND = 'https://door-client-backend.bonto.run';
let mode = 'login';

const form = document.getElementById('authForm');
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const msgEl = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const formTitle = document.getElementById('formTitle');
const toggleText = document.getElementById('toggleText');
const toggleLink = document.getElementById('toggleLink');

toggleLink.onclick = (e) => {
  e.preventDefault();
  mode = mode === 'login' ? 'register' : 'login';
  if (mode === 'register') {
    formTitle.textContent = 'Create account';
    submitBtn.textContent = 'Sign up';
    toggleText.textContent = 'Already have an account?';
    toggleLink.textContent = 'Sign in';
  } else {
    formTitle.textContent = 'Sign in';
    submitBtn.textContent = 'Sign in';
    toggleText.textContent = "Don't have an account?";
    toggleLink.textContent = 'Create one';
  }
  msgEl.textContent = '';
};

form.onsubmit = async (e) => {
  e.preventDefault();
  msgEl.className = 'msg';
  msgEl.textContent = '';
  submitBtn.disabled = true;

  const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';

  try {
    const res = await fetch(BACKEND + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailEl.value, password: passwordEl.value })
    });
    const data = await res.json();
    if (!res.ok) {
      msgEl.className = 'msg error';
      msgEl.textContent = data.error || 'Something went wrong';
      submitBtn.disabled = false;
      return;
    }

    // Save the token in this browser so future pages know who's logged in.
    localStorage.setItem('doorclient_token', data.token);
    localStorage.setItem('doorclient_email', data.email);

    msgEl.className = 'msg ok';
    msgEl.textContent = `Signed in as ${data.email} — redirecting…`;
    setTimeout(() => { window.location.href = 'cosmetic-lab.html'; }, 700);
  } catch (err) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Could not reach server — is it running?';
    submitBtn.disabled = false;
  }
};
</script>
</body>
</html>
